name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: agniview_test
          POSTGRES_USER: agniview
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agniview -d agniview_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m compileall -q backend
      - run: PYTHONPATH=backend pytest backend -q
        env:
          TEST_DATABASE_URL: postgresql://agniview:ci-${{ github.run_id }}@localhost:5432/agniview_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  containers:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: docker compose config
      - run: docker compose up -d --build postgres minio backend frontend
      - run: |
          for attempt in {1..30}; do
            curl --fail http://localhost:5000/health && curl --fail http://localhost:3000 && curl --fail http://localhost:3000/api/events && curl --fail http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose down --volumes
